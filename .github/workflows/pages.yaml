name: Build and deploy website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned Hugo
        timeout-minutes: 15
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '\r\n' < .hugo-version)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          archive="hugo_${version}_linux-amd64.tar.gz"
          mkdir -p "$RUNNER_TEMP/hugo"
          cd "$RUNNER_TEMP/hugo"
          for attempt in 1 2 3; do
            echo "Downloading Hugo v${version} release assets (attempt ${attempt}/3)..."
            if timeout 180 gh release download "v${version}" --repo gohugoio/hugo \
              --pattern "$archive" --pattern "hugo_${version}_checksums.txt" --clobber; then
              break
            fi
            if [[ "$attempt" == 3 ]]; then
              echo "::error::Failed to download Hugo release assets after 3 attempts."
              exit 1
            fi
            sleep 2
          done
          grep " ${archive}$" "hugo_${version}_checksums.txt" | sha256sum --check
          tar -xzf "$archive"
          echo "$RUNNER_TEMP/hugo" >> "$GITHUB_PATH"
      - name: Build website
        run: hugo --minify --destination public --panicOnWarning
      - name: Check content, images and internal links
        run: python3 scripts/check-site.py
      - name: Test the publishing checks
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: public
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6.0.0
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.1
