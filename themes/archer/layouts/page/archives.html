{{ define "main" }}
<div class="blog-layout">
	{{ partial "profile.html" . }}
	<main id="main" class="archives">
		{{ range (where site.RegularPages "Type" "post").GroupByDate "2006" }}
		<section><h2>{{ .Key }}</h2>{{ range .Pages }}<div class="archive-entry"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "01/02" }}</time><a href="{{ .RelPermalink }}">{{ .Title }}</a></div>{{ end }}</section>
		{{ end }}
	</main>
</div>
{{ end }}
